<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KVStore Docs</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-dim: #1f4273;
      --green: #3fb950;
      --green-dim: #1a3a23;
      --yellow: #d29922;
      --yellow-dim: #2a2210;
      --orange: #f0883e;
      --orange-dim: #2e1c0e;
      --red: #f85149;
      --red-dim: #2d1115;
      --purple: #a5d6ff;
      --sidebar-w: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .doc-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 16px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .doc-btn:hover { background: var(--surface2); }
    .doc-btn.active { background: var(--accent-dim); color: var(--accent); }

    .doc-btn .doc-icon { margin-right: 8px; font-size: 15px; }
    .doc-btn .doc-title { font-weight: 500; }
    .doc-btn .doc-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    #toc-section {
      padding: 12px 0;
      flex: 1;
    }

    #toc-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0 16px 8px;
    }

    #toc { list-style: none; }

    #toc li a {
      display: block;
      padding: 4px 16px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
      line-height: 1.5;
    }

    #toc li a:hover { color: var(--accent); }
    #toc li.h3 a { padding-left: 28px; font-size: 11px; }

    /* ── Main content ── */
    #main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    #topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #doc-title-bar {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    #content {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 32px 80px;
      width: 100%;
    }

    /* ── Markdown styles ── */
    #content h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    #content h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin: 40px 0 16px;
      padding-top: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      scroll-margin-top: 60px;
    }

    #content h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 28px 0 12px;
      scroll-margin-top: 60px;
    }

    #content h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin: 20px 0 8px;
    }

    #content p {
      line-height: 1.75;
      margin-bottom: 14px;
      color: var(--text);
      font-size: 14.5px;
    }

    #content a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }

    #content a:hover { border-bottom-color: var(--accent); }

    #content code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      background: var(--surface2);
      color: #e6edf3;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    #content pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      overflow-x: auto;
      margin: 14px 0;
    }

    #content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.65;
      color: #e6edf3;
    }

    #content blockquote {
      border-left: 4px solid var(--border);
      margin: 16px 0;
      padding: 12px 16px;
      background: var(--surface2);
      border-radius: 0 6px 6px 0;
      color: var(--text-muted);
    }

    #content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 36px 0;
    }

    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13.5px;
    }

    #content th {
      background: var(--surface2);
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      border: 1px solid var(--border);
      color: var(--text);
    }

    #content td {
      padding: 8px 14px;
      border: 1px solid var(--border);
      color: var(--text);
      line-height: 1.5;
    }

    #content tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    #content ul, #content ol {
      margin: 10px 0 14px 24px;
      line-height: 1.75;
      font-size: 14.5px;
    }

    #content li { margin-bottom: 4px; }

    /* ── GitHub Alerts ── */
    .alert {
      border-radius: 8px;
      padding: 14px 18px;
      margin: 18px 0;
      border-left: 4px solid;
      font-size: 14px;
      line-height: 1.65;
    }

    .alert-title {
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .alert-note    { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .alert-tip     { background: var(--green-dim);  border-color: var(--green);  color: var(--green); }
    .alert-important { background: var(--purple); background: rgba(165,214,255,0.08); border-color: #a5d6ff; color: #a5d6ff; }
    .alert-warning { background: var(--yellow-dim); border-color: var(--yellow); color: var(--yellow); }
    .alert-caution { background: var(--red-dim);    border-color: var(--red);    color: var(--red); }

    .alert p { color: var(--text); margin: 0; font-size: 14px; }

    /* ── Mermaid ── */
    .mermaid {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin: 16px 0;
      overflow-x: auto;
      text-align: center;
    }

    /* ── Loading ── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

<nav id="sidebar">
  <div id="sidebar-header">
    <h2>📚 KVStore Docs</h2>
  </div>

  <button class="doc-btn active" onclick="loadDoc('wal_walkthrough.md', this)" id="btn-wal">
    <span class="doc-icon">📝</span>
    <div>
      <div class="doc-title">WAL Walkthrough</div>
      <div class="doc-desc">Write-Ahead Log — полный разбор</div>
    </div>
  </button>

  <button class="doc-btn" onclick="loadDoc('pubsub_walkthrough.md', this)" id="btn-pubsub">
    <span class="doc-icon">📡</span>
    <div>
      <div class="doc-title">Pub/Sub Walkthrough</div>
      <div class="doc-desc">Hub, writePump, back-pressure</div>
    </div>
  </button>

  <button class="doc-btn" onclick="loadDoc('cluster_walkthrough.md', this)" id="btn-cluster">
    <span class="doc-icon">🌐</span>
    <div>
      <div class="doc-title">Cluster Walkthrough</div>
      <div class="doc-desc">Gossip, миграция, failover</div>
    </div>
  </button>

  <button class="doc-btn" onclick="loadDoc('cluster_map.md', this)" id="btn-map">
    <span class="doc-icon">🗺️</span>
    <div>
      <div class="doc-title">Cluster Map</div>
      <div class="doc-desc">Шпаргалка по кластерному коду</div>
    </div>
  </button>

  <div id="toc-section">
    <div id="toc-title">На этой странице</div>
    <ul id="toc"></ul>
  </div>
</nav>

<div id="main">
  <div id="topbar">
    <span id="doc-title-bar">WAL Walkthrough</span>
  </div>
  <div id="content">
    <div id="loading">Загрузка...</div>
  </div>
</div>

<script>
  // ── Mermaid init ──────────────────────────────────────────────
  mermaid.initialize({
    startOnLoad: false,
    theme: 'dark',
    themeVariables: {
      background: '#161b22',
      primaryColor: '#1f4273',
      primaryTextColor: '#e6edf3',
      primaryBorderColor: '#30363d',
      lineColor: '#58a6ff',
      secondaryColor: '#21262d',
      tertiaryColor: '#21262d',
      edgeLabelBackground: '#21262d',
      nodeTextColor: '#e6edf3',
      fontSize: '14px'
    },
    sequence: {
      actorFontFamily: 'Inter, sans-serif',
      noteFontFamily: 'Inter, sans-serif',
      messageFontFamily: 'Inter, sans-serif',
    }
  });

  // ── Marked setup ─────────────────────────────────────────────
  const renderer = new marked.Renderer();

  // Custom code block — detect mermaid
  renderer.code = function(token) {
    const code = token.text || token;
    const lang = (token.lang || '').trim();
    if (lang === 'mermaid') {
      return `<div class="mermaid">${code}</div>`;
    }
    const escaped = code
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    return `<pre><code class="language-${lang || ''}">${escaped}</code></pre>`;
  };

  marked.setOptions({ renderer, breaks: false, gfm: true });

  // ── Alert transformer ─────────────────────────────────────────
  function transformAlerts(html) {
    const types = {
      'NOTE':      { cls: 'alert-note',      icon: 'ℹ️' },
      'TIP':       { cls: 'alert-tip',       icon: '💡' },
      'IMPORTANT': { cls: 'alert-important', icon: '❗' },
      'WARNING':   { cls: 'alert-warning',   icon: '⚠️' },
      'CAUTION':   { cls: 'alert-caution',   icon: '🔴' },
    };

    // Replace GitHub-style alerts: <blockquote><p>[!TYPE]...</p></blockquote>
    return html.replace(
      /<blockquote>\s*<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]([\s\S]*?)<\/p>\s*<\/blockquote>/gi,
      (_, type, content) => {
        const t = types[type.toUpperCase()];
        if (!t) return _;
        const inner = content.trim();
        return `<div class="alert ${t.cls}">
          <div class="alert-title">${t.icon} ${type}</div>
          <p>${inner}</p>
        </div>`;
      }
    );
  }

  // ── GitHub link transformer ────────────────────────────────────
  function transformFileLinks(html) {
    // Стилизуем ссылки на GitHub код (выделяем строки)
    return html.replace(
      /href="(https:\/\/github\.com\/[^"]+\/blob\/[^"]+)"([^>]*)>/gi,
      (match, url, rest) => {
        // Извлекаем имя файла и строки из URL для tooltip
        const parts = url.split('/');
        const hashIdx = url.indexOf('#');
        const lineInfo = hashIdx > -1 ? url.slice(hashIdx + 1).replace('L', 'L') : '';
        const fileName = parts[parts.length - 1]?.split('#')[0] || '';
        const title = lineInfo
          ? `Открыть на GitHub: ${fileName} (${lineInfo.replace('-', '–')})`
          : `Открыть на GitHub: ${fileName}`;
        return `href="${url}" target="_blank" rel="noopener" title="${title}"${rest} style="border-bottom: 1px dashed #79c0ff; color: #79c0ff; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;">`;
      }
    );
  }

  // ── Build TOC from headings ───────────────────────────────────
  function buildTOC() {
    const toc = document.getElementById('toc');
    toc.innerHTML = '';
    const headings = document.querySelectorAll('#content h2, #content h3');
    headings.forEach(h => {
      if (!h.id) {
        h.id = h.textContent
          .trim()
          .toLowerCase()
          .replace(/[^\wа-яё\s-]/gi, '')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-');
      }
      const li = document.createElement('li');
      li.className = h.tagName === 'H3' ? 'h3' : 'h2';
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.trim();
      a.onclick = e => {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      li.appendChild(a);
      toc.appendChild(li);
    });
  }

  // ── Load doc ──────────────────────────────────────────────────
  async function loadDoc(filename, btn) {
    document.querySelectorAll('.doc-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const titleMap = {
      'wal_walkthrough.md':     'WAL Walkthrough',
      'pubsub_walkthrough.md':  'Pub/Sub Walkthrough',
      'cluster_walkthrough.md': 'Cluster Walkthrough',
      'cluster_map.md':         'Cluster Map — Шпаргалка',
    };
    document.getElementById('doc-title-bar').textContent = titleMap[filename] || filename;

    const content = document.getElementById('content');
    content.innerHTML = '<div id="loading">Загрузка...</div>';

    try {
      const resp = await fetch(filename);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const md = await resp.text();

      let html = marked.parse(md);
      html = transformAlerts(html);
      html = transformFileLinks(html);

      content.innerHTML = html;

      // Render mermaid diagrams
      await mermaid.run({
        querySelector: '.mermaid',
      });

      buildTOC();

      // Scroll to top
      document.getElementById('main').scrollTop = 0;

    } catch (err) {
      content.innerHTML = `<div style="color:#f85149; padding: 20px;">
        Ошибка загрузки <b>${filename}</b>:<br>${err.message}<br><br>
        <small style="color:#8b949e;">
          Убедитесь что сервер запущен из папки <code>docs/</code>:<br>
          <code>cd docs && python3 -m http.server 7890</code>
        </small>
      </div>`;
    }
  }

  // ── Init ──────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    loadDoc('wal_walkthrough.md', document.getElementById('btn-wal'));
  });
</script>
</body>
</html>
