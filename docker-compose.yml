services:
  # ─── KVStore ──────────────────────────────────────
  # Основной сервер. Ollama НЕ обязательна: без профиля `ai` сервер стартует
  # сразу, работает всё, кроме AI.* (они отвечают внятной ошибкой). Если
  # профиль включён — сервер сам подхватит Ollama, когда та поднимется
  # (фоновый re-ping), рестарт не нужен.
  kvstore:
    build: .
    container_name: kvstore
    ports:
      - "6380:6380"
      - "9090:9090"
    volumes:
      - kvstore-data:/app/data
    command:
      # 0.0.0.0 внутри контейнера безопасно: наружу торчат только порты из ports:
      - "--bind=0.0.0.0"
      - "--port=6380"
      - "--ollama-url=http://ollama:11434"
      - "--metrics-port=9090"
    restart: unless-stopped

  # ─── Ollama (опционально: --profile ai) ───────────
  # RAG-демо-слой для команд AI.*. Ядро (VSIM.*/KV) в нём не нуждается —
  # векторы можно приносить от любого провайдера (BYO-embeddings).
  # Запуск: docker compose --profile ai up -d --build
  # GPU пробрасывается автоматически, если доступен (deploy.resources).
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ai"]
    ports:
      - "11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # ─── Ollama Init (опционально: --profile ai) ──────
  # Одноразовый контейнер: скачивает модели при первом запуске.
  #   nomic-embed-text (~0.3GB) — embeddings: AI.EMBED / AI.INGEST / AI.SEARCH
  #   gemma4:e2b       (~7GB)   — chat-модель: AI.ASK (RAG)
  # Если 7GB не нужны (только embeddings):
  #   OLLAMA_SKIP_CHAT_MODEL=1 docker compose --profile ai up -d
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    profiles: ["ai"]
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_SKIP_CHAT_MODEL=${OLLAMA_SKIP_CHAT_MODEL:-0}
    entrypoint: |
      sh -c "
        echo 'Waiting for Ollama to start...'
        until ollama list > /dev/null 2>&1; do
          sleep 1
        done
        echo 'Pulling embedding model...'
        ollama pull nomic-embed-text
        if [ \"$$OLLAMA_SKIP_CHAT_MODEL\" != \"1\" ]; then
          echo 'Pulling chat model for AI.ASK (~7GB, skip with OLLAMA_SKIP_CHAT_MODEL=1)...'
          ollama pull gemma4:e2b
        fi
        echo 'Models ready!'
      "

  # ─── VictoriaMetrics ──────────────────────────────
  # Time Series Database для сбора и хранения метрик
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - vm-data:/victoria-metrics-data
    command:
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  # ─── Grafana ──────────────────────────────────────
  # Визуализация метрик и дашборд
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/grafana/provisioning/dashboards/kvstore_dashboard.json:/etc/grafana/provisioning/dashboards/kvstore_dashboard.json
      - grafana-data:/var/lib/grafana
    environment:
      # Локальный дев-стенд: дефолтный пароль + анонимный админ.
      # НЕ выставлять порт 3000 за пределы localhost с этими настройками.
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - victoriametrics
    restart: unless-stopped

volumes:
  kvstore-data:
  ollama-models:
  vm-data:
  grafana-data:
