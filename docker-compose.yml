services:
  # ─── KVStore ──────────────────────────────────────
  # Основной сервер. Эмбеддинги приносит клиент (BYO): движок не ходит ни в
  # какой внешний сервис, кроме опционального WAL-shipping.
  kvstore:
    build: .
    container_name: kvstore
    ports:
      - "6380:6380"
      - "9090:9090"
    volumes:
      - kvstore-data:/app/data
    command:
      # 0.0.0.0 внутри контейнера безопасно: наружу торчат только порты из ports:
      - "--bind=0.0.0.0"
      - "--port=6380"
      - "--metrics-port=9090"
    restart: unless-stopped

  # ─── VictoriaMetrics ──────────────────────────────
  # Time Series Database для сбора и хранения метрик
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - vm-data:/victoria-metrics-data
    command:
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  # ─── Grafana ──────────────────────────────────────
  # Визуализация метрик и дашборд
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/grafana/provisioning/dashboards/kvstore_dashboard.json:/etc/grafana/provisioning/dashboards/kvstore_dashboard.json
      - grafana-data:/var/lib/grafana
    environment:
      # Локальный дев-стенд: дефолтный пароль + анонимный админ.
      # НЕ выставлять порт 3000 за пределы localhost с этими настройками.
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - victoriametrics
    restart: unless-stopped

volumes:
  kvstore-data:
  vm-data:
  grafana-data:
