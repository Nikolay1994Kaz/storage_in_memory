name: Soak Test (Load, Drift & Durability Oracle)

# Ручной запуск. Гоняет нагрузку двумя фазами с рестартом сервера между ними и
# ПОСЛЕ, проверяя между делом durability-oracle: seed известных KV+векторов (часть
# удалена) → нагрузка → рестарт → verify, что живые пережили, а удалённые НЕ
# воскресли. Ловит класс багов, чинённых 03.07 (watermark-гонка/OpDel-гейт/
# tombstone-воскрешение) — то, что чистая нагрузка не видит.
#
# hosted-раннер GitHub капает job на 6ч, поэтому per-фаза по умолчанию 2h30m
# (итого ~5ч load) + запас на build/seed/verify. timeout-minutes: 350 держит нас
# под капом с полем.

on:
  workflow_dispatch:
    inputs:
      phase_duration:
        description: 'Длительность ОДНОЙ фазы нагрузки (всего 2 фазы). Напр. 2h30m, 30m, 5m'
        required: true
        default: '2h30m'
      concurrency:
        description: 'Число параллельных клиентов нагрузки'
        required: true
        default: '32'
      restart_mode:
        description: 'graceful (SIGTERM, полный flush) или crash (SIGKILL с барьером fsync)'
        required: true
        default: 'graceful'
        type: choice
        options: [graceful, crash]
      oracle_keys:
        description: 'Число контрольных ключей oracle'
        required: true
        default: '500'
      sample_interval:
        description: 'Интервал сэмплинга дрейфа RSS/vector-стора внутри фазы, сек'
        required: true
        default: '300'

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # < 6ч кап hosted-раннера, с запасом на сборку/verify

    env:
      PORT: '6380'
      MPORT: '9090'
      DUR: ${{ github.event.inputs.phase_duration || '2h30m' }}
      CONC: ${{ github.event.inputs.concurrency || '32' }}
      MODE: ${{ github.event.inputs.restart_mode || 'graceful' }}
      NKEYS: ${{ github.event.inputs.oracle_keys || '500' }}
      SAMPLE: ${{ github.event.inputs.sample_interval || '300' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build binaries
        run: |
          go build -o kvstore-server ./kvstore/cmd/kvstore/
          go build -o kvstore-stress ./kvstore/cmd/stress_test/
          go build -o soak-oracle   ./kvstore/cmd/soak_oracle/

      # Утилиты (start/wait/restart/drift) как файл, чтобы шаги переиспользовали.
      # Сервер персистит в ./data относительно cwd; все шаги идут из workspace-корня,
      # поэтому рестарт восстанавливается из того же ./data.
      - name: Write helpers
        run: |
          cat > soak_lib.sh <<'EOF'
          start_server() {
            # --partition-attr tenant включает tenant-роутинг колоночного слоя,
            # чтобы нагрузка (VSIM.ADDATTR/FILTER) и oracle (tenant-изоляция) били
            # путь #2 по-настоящему, а не только предикатный фильтр.
            # -pprof: при обнаружении дрейфа heap/goroutine-профиль снимается сразу
            # с живого процесса (localhost:MPORT/debug/pprof/), без перезапуска.
            ./kvstore-server --port "$PORT" --metrics-port "$MPORT" --partition-attr tenant --pprof > "$1" 2>&1 &
            echo $! > server.pid
            # Ждём /ready (не /metrics): порт открывается ДО реплея WAL, а готовность
            # выставляется только после снапшот+WAL+listener. На рестарте после
            # многочасовой нагрузки recovery легко превышает 30с — ждём до 10 минут,
            # но падаем сразу, если процесс умер (не крутим таймаут впустую).
            for _ in $(seq 1 600); do
              kill -0 "$(cat server.pid)" 2>/dev/null || { echo "server процесс умер при старте"; cat "$1"; return 1; }
              [ "$(curl -s -o /dev/null -w '%{http_code}' "localhost:$MPORT/ready" 2>/dev/null)" = "200" ] && return 0
              sleep 1
            done
            echo "server not ready за 600с"; cat "$1"; return 1
          }
          stop_server() { # graceful|crash
            local pid; pid=$(cat server.pid)
            if [ "$1" = "crash" ]; then
              sleep 2                    # барьер: syncInterval=100ms → WAL fsync'нут
              kill -9 "$pid" 2>/dev/null
            else
              kill -TERM "$pid" 2>/dev/null
              for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
              kill -0 "$pid" 2>/dev/null && { echo "graceful shutdown ЗАВИС"; return 1; }
            fi
            return 0
          }
          drift() { # метка → в drift.log
            { echo "=== $(date -u +%H:%M:%S) $1 ==="
              ps -o rss= -p "$(cat server.pid)" 2>/dev/null | awk '{print "server_rss_kb="$1}'
              # Разводим гипотезу RSS-дрейфа: живой рабочий набор мал, а RSS растёт.
              #  • process_resident_memory_bytes — полный RSS процесса.
              #  • go_memstats_sys_bytes / heap_inuse — сколько держит Go-куча;
              #    (RSS − go_sys) ≈ off-heap tcmalloc/mmap → это наш аллокатор.
              #  • vector_total_vectors / delta_len — размер ЖИВОГО набора.
              #  • vector_tombstones / segments{level} — накопление НЕживого
              #    (deletes на скомпакченном + несмёрженные сегменты) = гл. подозреваемый.
              #  • vector_allocator_bytes / data_bytes — что аллокатор реально держит
              #    под графы/соседей и под float32-slab'ы.
              # Сопоставление этих рядов во времени скажет: копятся tombstones/сегменты
              # или это retention аллокатора без роста живого набора.
              #  • flush_delta_total — регресс-страж flush-storm (2577 flush/6мин был
              #    симптомом): счётчик обязан расти умеренно, рывок = буря вернулась.
              #  • compaction/rollback, oom_events, wal_fail_stop, ship_errors/bytes,
              #    active_connections — дешёвые «ничего не тлеет?» ряды.
              curl -s "localhost:$MPORT/metrics" 2>/dev/null | grep -E \
                "^go_goroutines |^process_resident_memory_bytes |^go_memstats_sys_bytes |^go_memstats_heap_inuse_bytes |^kvstore_vector_total_vectors |^kvstore_vector_delta_len |^kvstore_vector_tombstones |^kvstore_vector_allocator_bytes |^kvstore_vector_data_bytes |^kvstore_vector_segments|^kvstore_vector_flush_delta_total |^kvstore_vector_compaction_total |^kvstore_vector_compaction_rollback_total |^kvstore_oom_events_total |^kvstore_wal_fail_stop_total |^kvstore_ship_errors_total |^kvstore_ship_uploaded_bytes_total |^kvstore_network_active_connections " || true
            } >> drift.log
          }
          # Фоновый сэмплер дрейфа: пишет drift() каждые SAMPLE секунд, пока жив.
          # Нужен, чтобы видеть ТРЕНД внутри фазы нагрузки, а не только по 3 точкам
          # рестарта (2 точки тренд не задают — именно этого не хватило прошлому прогону).
          start_drift_sampler() { # $1=метка
            ( while true; do sleep "${SAMPLE:-300}"; drift "$1"; done ) &
            echo $! > sampler.pid
          }
          stop_drift_sampler() {
            [ -f sampler.pid ] && kill "$(cat sampler.pid)" 2>/dev/null || true
            rm -f sampler.pid
          }
          EOF

      - name: Start server + seed oracle
        run: |
          source soak_lib.sh
          start_server server-1.log
          ./soak-oracle -mode seed -addr "localhost:$PORT" -n "$NKEYS"
          drift "t0 after-seed"

      - name: Load phase 1
        run: |
          source soak_lib.sh
          echo "phase 1: duration=$DUR concurrency=$CONC sample=${SAMPLE}s"
          start_drift_sampler "sample phase1"
          ./kvstore-stress -duration "$DUR" -concurrency "$CONC" \
            -addr "localhost:$PORT" -metrics-addr "localhost:$MPORT" 2>&1 | tee stress-1.log
          stop_drift_sampler

      - name: Restart + oracle verify (checkpoint A)
        run: |
          source soak_lib.sh
          drift "t1 pre-restart-A"
          stop_server "$MODE"
          start_server server-2.log
          drift "t1 post-restart-A"
          echo "::group::oracle verify A"
          ./soak-oracle -mode verify -addr "localhost:$PORT" -n "$NKEYS"
          echo "::endgroup::"

      - name: Load phase 2
        run: |
          source soak_lib.sh
          echo "phase 2: duration=$DUR concurrency=$CONC sample=${SAMPLE}s"
          start_drift_sampler "sample phase2"
          ./kvstore-stress -duration "$DUR" -concurrency "$CONC" \
            -addr "localhost:$PORT" -metrics-addr "localhost:$MPORT" 2>&1 | tee stress-2.log
          stop_drift_sampler

      - name: Final restart + oracle verify (checkpoint B)
        run: |
          source soak_lib.sh
          drift "t2 pre-restart-B"
          stop_server "$MODE"
          start_server server-3.log
          drift "t2 post-restart-B"
          echo "::group::oracle verify B"
          ./soak-oracle -mode verify -addr "localhost:$PORT" -n "$NKEYS"
          echo "::endgroup::"

      - name: Drift report
        if: always()
        run: |
          echo "=== DRIFT (RSS / goroutines / process_rss по чекпойнтам) ==="
          cat drift.log || true

      - name: Stop server
        if: always()
        run: |
          [ -f server.pid ] && kill -9 "$(cat server.pid)" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-artifacts
          path: |
            server-*.log
            stress-*.log
            drift.log
