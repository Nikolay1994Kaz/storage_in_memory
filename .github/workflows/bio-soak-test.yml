name: Bio-Stress Soak Test (6 Hours)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  bio-soak-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Run Bio Stress Test
      run: |
        go run ./kvstore/examples/bio_stress/main.go 2>&1 | tee bio_stress.log

    - name: Upload Logs Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bio-stress-logs
        path: |
          bio_stress.log
