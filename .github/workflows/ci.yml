name: CI

# Гейт корректности на каждый push в master и каждый PR: код собирается,
# отформатирован, проходит vet и тесты. Долгие нагрузочные прогоны — в
# отдельных soak-воркфлоу.
on:
  push:
    branches: [master]
  pull_request:

# Отменяем устаревшие прогоны на той же ветке/PR при новом пуше.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Build / vet / gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # experimental-сборка (кластер за build-tag): собираем и её, чтобы код
      # за тегом не сгнил при рефакторингах прод-путей.
      - name: Build (experimental)
        run: go build -tags experimental ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l kvstore/)
          if [ -n "$unformatted" ]; then
            echo "::error::Файлы не отформатированы gofmt (запусти 'gofmt -w'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (experimental)
        run: go vet -tags experimental ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Конкурентно-критичные пакеты (server, store, wal) — с -race.
      - name: Test (race)
        run: go test -short -race -timeout 15m ./kvstore/internal/...

      # Кластер за build-tag experimental — гоняем отдельно под тегом (gossip/
      # репликация конкурентны, поэтому тоже с -race).
      - name: Test (experimental cluster, race)
        run: go test -short -race -tags experimental -timeout 15m ./kvstore/internal/cluster/...

      # Алгоритмика vector: под -short ~35с (тяжёлые бенчи/репорты скипаются,
      # корректностные тесты остаются). Без -race — гоним однопоточно для скорости.
      - name: Test (vector)
        run: go test -short -timeout 5m ./kvstore/vector/
